import argparse
from pyspark.sql import SparkSession
from pyspark.sql import functions as F
from pyspark.sql.window import Window


def add_partition_columns(df, date_str):
    """
    Adds metric_date, year, month and day columns.
    This is useful for partitioned analytical outputs.
    """
    year, month, day = date_str.split("-")

    return (
        df.withColumn("metric_date", F.lit(date_str))
        .withColumn("year", F.lit(year))
        .withColumn("month", F.lit(month))
        .withColumn("day", F.lit(day))
    )


def write_parquet(df, output_path, table_name):
    """
    Writes a DataFrame in Parquet format partitioned by year/month/day.
    """
    (
        df.write.mode("overwrite")
        .partitionBy("year", "month", "day")
        .parquet(f"{output_path}/{table_name}")
    )


def build_page_metrics(events_df, date_str):
    page_views = events_df.filter(F.col("event_type") == "page_view")

    page_metrics = (
        page_views.groupBy("page_url")
        .agg(
            F.avg("time_on_page_seconds").alias("avg_time_on_page"),
            F.count("*").alias("total_views"),
        )
        .orderBy(F.desc("avg_time_on_page"))
    )

    return add_partition_columns(page_metrics, date_str)


def build_bounce_rate(events_df, date_str):
    page_views = events_df.filter(F.col("event_type") == "page_view")

    session_counts = (
        page_views.groupBy("session_id")
        .agg(
            F.count("*").alias("page_views_in_session"),
            F.first("page_type").alias("page_type"),
        )
    )

    bounce_rate = (
        session_counts.groupBy("page_type")
        .agg(
            F.count("*").alias("total_sessions"),
            F.sum(
                F.when(F.col("page_views_in_session") == 1, 1).otherwise(0)
            ).alias("bounce_sessions"),
        )
        .withColumn(
            "bounce_rate",
            F.when(
                F.col("total_sessions") > 0,
                F.col("bounce_sessions") / F.col("total_sessions"),
            ).otherwise(F.lit(0.0)),
        )
        .orderBy(F.desc("bounce_rate"))
    )

    return add_partition_columns(bounce_rate, date_str)


def build_funnel(events_df, transactions_df, date_str):
    sessions = events_df.select("session_id").distinct()

    page_view_sessions = (
        events_df.filter(F.col("event_type") == "page_view")
        .select("session_id")
        .distinct()
        .withColumn("has_page_view", F.lit(1))
    )

    product_view_sessions = (
        events_df.filter(F.col("event_type") == "product_view")
        .select("session_id")
        .distinct()
        .withColumn("has_product_view", F.lit(1))
    )

    cart_sessions = (
        events_df.filter(
            (F.col("event_type") == "cart_event") & (F.col("action") == "add")
        )
        .select("session_id")
        .distinct()
        .withColumn("has_cart_add", F.lit(1))
    )

    if transactions_df is not None:
        purchase_sessions = (
            transactions_df.select("session_id")
            .distinct()
            .withColumn("has_purchase", F.lit(1))
        )
    else:
        purchase_sessions = (
            events_df.filter(F.col("event_type") == "purchase")
            .select("session_id")
            .distinct()
            .withColumn("has_purchase", F.lit(1))
        )

    funnel_base = (
        sessions.join(page_view_sessions, "session_id", "left")
        .join(product_view_sessions, "session_id", "left")
        .join(cart_sessions, "session_id", "left")
        .join(purchase_sessions, "session_id", "left")
        .fillna(0)
    )

    funnel = funnel_base.agg(
        F.count("*").alias("total_sessions"),
        F.sum("has_page_view").alias("page_view_sessions"),
        F.sum("has_product_view").alias("product_view_sessions"),
        F.sum("has_cart_add").alias("cart_add_sessions"),
        F.sum("has_purchase").alias("purchase_sessions"),
    )

    funnel = (
        funnel.withColumn(
            "product_view_rate",
            F.col("product_view_sessions") / F.col("total_sessions"),
        )
        .withColumn(
            "cart_add_rate",
            F.col("cart_add_sessions") / F.col("total_sessions"),
        )
        .withColumn(
            "purchase_rate",
            F.col("purchase_sessions") / F.col("total_sessions"),
        )
    )

    return add_partition_columns(funnel, date_str)


def build_product_conversion(events_df, date_str):
    product_views = (
        events_df.filter(F.col("event_type") == "product_view")
        .groupBy("product_id")
        .agg(F.count("*").alias("product_views"))
    )

    cart_adds = (
        events_df.filter(
            (F.col("event_type") == "cart_event") & (F.col("action") == "add")
        )
        .groupBy("product_id")
        .agg(F.count("*").alias("cart_adds"))
    )

    product_conversion = (
        product_views.join(cart_adds, "product_id", "left")
        .fillna({"cart_adds": 0})
        .withColumn(
            "cart_add_rate",
            F.when(
                F.col("product_views") > 0,
                F.col("cart_adds") / F.col("product_views"),
            ).otherwise(F.lit(0.0)),
        )
        .withColumn(
            "candidate_for_improvement",
            F.when(
                (F.col("product_views") >= 10) & (F.col("cart_add_rate") < 0.05),
                F.lit(True),
            ).otherwise(F.lit(False)),
        )
        .orderBy(F.desc("product_views"))
    )

    return add_partition_columns(product_conversion, date_str)


def build_routes(events_df, date_str):
    route_events = events_df.filter(
        F.col("event_type").isin("page_view", "product_view", "search", "cart_event", "click")
    )

    if "sequence_number" not in route_events.columns:
        route_events = route_events.withColumn(
            "sequence_number",
            F.row_number().over(
                Window.partitionBy("session_id").orderBy("timestamp")
            ),
        )

    route_events = route_events.withColumn(
        "route_step",
        F.when(F.col("event_type") == "page_view", F.col("page_type"))
        .when(F.col("event_type") == "product_view", F.lit("product_view"))
        .when(F.col("event_type") == "search", F.lit("search"))
        .when(F.col("event_type") == "cart_event", F.concat(F.lit("cart_"), F.col("action")))
        .otherwise(F.col("event_type")),
    )

    ordered = (
        route_events.select("session_id", "sequence_number", "route_step")
        .orderBy("session_id", "sequence_number")
    )

    routes_by_session = (
        ordered.groupBy("session_id")
        .agg(F.collect_list("route_step").alias("steps"))
        .withColumn("route", F.concat_ws(" > ", F.col("steps")))
    )

    routes = (
        routes_by_session.groupBy("route")
        .agg(F.count("*").alias("sessions"))
        .orderBy(F.desc("sessions"))
    )

    return add_partition_columns(routes, date_str)


def build_device_country(events_df, date_str):
    page_views = events_df.filter(F.col("event_type") == "page_view")

    device_country = (
        page_views.groupBy("country", "device_type")
        .agg(
            F.countDistinct("session_id").alias("sessions"),
            F.avg("time_on_page_seconds").alias("avg_time_on_page"),
        )
        .orderBy(F.desc("sessions"))
    )

    return add_partition_columns(device_country, date_str)


def build_anomalies(events_df, date_str):
    page_views = events_df.filter(F.col("event_type") == "page_view")

    session_metrics = (
        page_views.groupBy("session_id")
        .agg(
            F.sum("time_on_page_seconds").alias("metric_value")
        )
        .withColumn("metric_name", F.lit("session_total_time"))
    )

    stats = session_metrics.agg(
        F.avg("metric_value").alias("mean_value"),
        F.stddev("metric_value").alias("std_value"),
    ).collect()[0]

    mean_value = stats["mean_value"] or 0.0
    std_value = stats["std_value"] or 0.0

    if std_value == 0:
        anomalies = session_metrics.limit(0).withColumn("z_score", F.lit(0.0))
    else:
        anomalies = (
            session_metrics.withColumn(
                "z_score",
                (F.col("metric_value") - F.lit(mean_value)) / F.lit(std_value),
            )
            .filter(F.abs(F.col("z_score")) >= 3)
            .withColumn("anomaly_type", F.lit("z_score"))
        )

    selected = anomalies.select(
        "session_id",
        "metric_name",
        "metric_value",
        "z_score",
        "anomaly_type",
    )

    return add_partition_columns(selected, date_str)


def main():
    parser = argparse.ArgumentParser(description="ShopStream PySpark metrics job")

    parser.add_argument(
        "--input",
        required=True,
        help="Input path for validated events JSONL",
    )

    parser.add_argument(
        "--output",
        required=True,
        help="Output path for processed parquet metrics",
    )

    parser.add_argument(
        "--date",
        required=True,
        help="Processing date in YYYY-MM-DD format",
    )

    parser.add_argument(
        "--transactions",
        required=False,
        default=None,
        help="Optional transactions CSV path",
    )

    args = parser.parse_args()

    spark = (
        SparkSession.builder
        .appName("ShopStream Metrics Job")
        .getOrCreate()
    )

    spark.sparkContext.setLogLevel("WARN")

    events_df = spark.read.json(args.input)

    events_df = events_df.dropDuplicates(["event_id"])

    events_df = events_df.withColumn(
        "time_on_page_seconds",
        F.when(
            F.col("time_on_page_seconds").isNull(),
            F.lit(0),
        ).otherwise(F.col("time_on_page_seconds")),
    )

    events_df = events_df.withColumn(
        "country",
        F.when(F.col("country").isNull(), F.lit("UNKNOWN")).otherwise(F.col("country")),
    )

    events_df = events_df.withColumn(
        "device_type",
        F.when(F.col("device_type").isNull(), F.lit("unknown")).otherwise(F.col("device_type")),
    )

    events_df = events_df.withColumn(
        "page_type",
        F.when(F.col("page_type").isNull(), F.lit("unknown")).otherwise(F.col("page_type")),
    )

    events_df = events_df.withColumn(
        "timestamp",
        F.to_timestamp("timestamp"),
    )

    transactions_df = None

    if args.transactions:
        try:
            transactions_df = (
                spark.read.option("header", True)
                .option("inferSchema", True)
                .csv(args.transactions)
            )
        except Exception:
            transactions_df = None

    page_metrics = build_page_metrics(events_df, args.date)
    bounce_rate = build_bounce_rate(events_df, args.date)
    funnel = build_funnel(events_df, transactions_df, args.date)
    product_conversion = build_product_conversion(events_df, args.date)
    routes = build_routes(events_df, args.date)
    device_country = build_device_country(events_df, args.date)
    anomalies = build_anomalies(events_df, args.date)

    write_parquet(page_metrics, args.output, "page_metrics")
    write_parquet(bounce_rate, args.output, "bounce_rate")
    write_parquet(funnel, args.output, "funnel")
    write_parquet(product_conversion, args.output, "product_conversion")
    write_parquet(routes, args.output, "routes")
    write_parquet(device_country, args.output, "device_country")
    write_parquet(anomalies, args.output, "anomalies")

    print("ShopStream metrics job completed successfully.")
    print(f"Input: {args.input}")
    print(f"Output: {args.output}")
    print(f"Date: {args.date}")

    spark.stop()


if __name__ == "__main__":
    main()
